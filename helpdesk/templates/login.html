{% extends "base.html" %}
{% block titulo %}Entrar{% endblock %}
{% block conteudo %}
<div class="fixed inset-0 -z-10 overflow-hidden bg-white text-slate-500"
     data-glyph-background data-shape-color="#3b82f6" data-font-size="11" data-haze="0.3" aria-hidden="true"></div>
<section class="relative z-10 mx-auto max-w-md bg-white rounded-lg shadow p-8">
  <h1 class="text-2xl font-semibold mb-6">Entrar na plataforma</h1>
  <form method="post" action="{{ url_for('auth.login') }}" class="space-y-4">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div>
      <label for="email" class="block text-sm font-medium mb-1">E-mail</label>
      <input id="email" name="email" type="email" required autocomplete="username" value="{{ email }}"
             class="w-full rounded border border-slate-300 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-slate-500">
    </div>
    <div>
      <label for="senha" class="block text-sm font-medium mb-1">Senha</label>
      <input id="senha" name="senha" type="password" required autocomplete="current-password"
             class="w-full rounded border border-slate-300 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-slate-500">
    </div>
    <button type="submit" class="w-full rounded bg-slate-900 text-white py-2 font-medium hover:bg-slate-700">Entrar</button>
  </form>
  {% if contas_demo %}
  <div class="mt-8 border-t pt-5">
    <h2 class="text-xs font-semibold uppercase tracking-wide text-slate-500 mb-3">Acesso Rápido (Demo Portfólio)</h2>
    <div class="grid grid-cols-3 gap-2">
      <button type="button" data-demo="admin" class="rounded border border-violet-200 bg-violet-50 px-2 py-1.5 text-xs font-medium text-violet-800 hover:bg-violet-100">Admin</button>
      <button type="button" data-demo="tecnico" class="rounded border border-teal-200 bg-teal-50 px-2 py-1.5 text-xs font-medium text-teal-800 hover:bg-teal-100">Técnico</button>
      <button type="button" data-demo="cliente" class="rounded border border-slate-200 bg-slate-50 px-2 py-1.5 text-xs font-medium text-slate-700 hover:bg-slate-100">Cliente</button>
    </div>
  </div>
  {% endif %}
</section>
{% endblock %}
{% block scripts %}
<script type="module" src="{{ url_for('static', filename='js/glyph-background.js') }}"></script>
{% if contas_demo %}
<script>
  (function () {
    const contas = {{ contas_demo | tojson }};
    const email = document.getElementById("email");
    const senha = document.getElementById("senha");
    document.querySelectorAll("[data-demo]").forEach((botao) => {
      botao.addEventListener("click", () => {
        const papel = botao.dataset.demo;
        email.value = contas.contas[papel];
        senha.value = contas.senha;
        senha.focus();
      });
    });
  })();
</script>
{% endif %}
{% endblock %}
